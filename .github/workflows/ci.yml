name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_vector_data:
        description: Publish the verified VectorData package to nuget.org (main only)
        required: true
        default: false
        type: boolean
      publish_agent_framework:
        description: Publish the verified Agent Framework package to nuget.org (main only)
        required: true
        default: false
        type: boolean

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build Vespa.NET.slnx -c Release

      - name: Test (unit)
        run: dotnet test tests/Vespa.NET.Tests/Vespa.NET.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test (VectorData connector)
        run: dotnet test tests/Vespa.NET.VectorData.Tests/Vespa.NET.VectorData.Tests.csproj -c Release --no-build --verbosity normal

      - name: Test (Agent Framework persistence)
        run: dotnet test tests/Vespa.NET.AgentFramework.Tests/Vespa.NET.AgentFramework.Tests.csproj -c Release --no-build --verbosity normal

  test-vector-data-live:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test connector against real Vespa
        env:
          VESPA_VECTOR_DATA_INTEGRATION_TESTS: '1'
        run: >-
          dotnet test tests/Vespa.NET.VectorData.Tests -c Release --verbosity normal
          --filter 'FullyQualifiedName~LiveVespaTests|FullyQualifiedName~LiveFeatureTests'

  package-agent-framework:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Validate publishing branch
        if: inputs.publish_agent_framework && github.ref != 'refs/heads/main'
        run: |
          echo "Publish Agent Framework from main after merging the reviewed changes."
          exit 1

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack integration
        run: dotnet pack src/Vespa.NET.AgentFramework -c Release -o artifacts/agent-framework

      - name: Verify package against published dependencies
        run: python3 scripts/verify-agent-framework-package.py artifacts/agent-framework

      - uses: actions/upload-artifact@v7
        with:
          name: Vespa.NET.AgentFramework
          path: artifacts/agent-framework/Vespa.NET.AgentFramework.*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish-agent-framework:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_agent_framework && github.ref == 'refs/heads/main'
    needs: [build-and-test, package-agent-framework]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: Vespa.NET.AgentFramework
          path: artifacts/agent-framework

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish verified integration to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/agent-framework/Vespa.NET.AgentFramework.*.nupkg --source https://api.nuget.org/v3/index.json

  package-vector-data:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_changed: ${{ steps.version.outputs.version_changed }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check connector release version
        id: version
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/vector-data-release-version.py --previous-ref "$BASE_REF"

      - name: Validate publishing branch
        if: inputs.publish_vector_data && github.ref != 'refs/heads/main'
        run: |
          echo "Publish VectorData from main after merging the reviewed release changes."
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack connector
        run: dotnet pack src/Vespa.NET.VectorData -c Release -o artifacts/packages

      - name: Verify package against published dependencies
        run: python3 scripts/verify-vector-data-package.py artifacts/packages

      - name: Upload verified package
        uses: actions/upload-artifact@v7
        with:
          name: Vespa.NET.VectorData
          path: artifacts/packages/Vespa.NET.VectorData.*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish-vector-data:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.package-vector-data.outputs.version_changed == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_vector_data))
    needs: [build-and-test, package-vector-data, test-vector-data-live]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: vector-data-publish-${{ needs.package-vector-data.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: Vespa.NET.VectorData
          path: artifacts/packages

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish verified connector to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/packages/Vespa.NET.VectorData.*.nupkg --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        run: |
          dotnet pack src/Vespa.NET.Models/Vespa.NET.Models.csproj -c Release -o ./artifacts
          dotnet pack src/Vespa.NET/Vespa.NET.csproj -c Release -o ./artifacts
          dotnet pack src/Vespa.NET.Testcontainers/Vespa.NET.Testcontainers.csproj -c Release -o ./artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
