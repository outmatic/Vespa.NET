name: Package VectorData

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack connector
        run: dotnet pack src/Vespa.NET.VectorData -c Release -o artifacts/packages

      - name: Verify package against published dependencies
        run: python3 scripts/verify-vector-data-package.py artifacts/packages

      - name: Upload package for review
        uses: actions/upload-artifact@v7
        with:
          name: Vespa.NET.VectorData
          path: artifacts/packages/Vespa.NET.VectorData.*.nupkg
          if-no-files-found: error
          retention-days: 14
